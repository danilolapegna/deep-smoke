<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="app">
      <h1>Sign in</h1>
      <form id="login-form" onsubmit="event.preventDefault(); localStorage.setItem('deep-smoke-session', document.getElementById('email').value); location.assign('/private');">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" />
        <button type="submit">Sign in</button>
      </form>
      <p><a href="/">Home</a></p>
    </main>
  </body>
</html>
